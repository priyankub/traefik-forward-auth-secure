name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload binaries for
        required: true

permissions:
  contents: read

jobs:

  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.TAG }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'

    - name: Build binaries
      run: |
        build() { CGO_ENABLED=0 GOOS=linux GOARCH="$1" GOARM="$2" go build -trimpath -ldflags="-s -w" -o "traefik-forward-auth_$3" ./cmd; }
        build amd64 "" amd64
        build arm64 "" arm64
        build arm 7 arm
        sha256sum traefik-forward-auth_* > SHA256SUMS

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release upload "$TAG" traefik-forward-auth_amd64 traefik-forward-auth_arm64 traefik-forward-auth_arm SHA256SUMS --clobber
