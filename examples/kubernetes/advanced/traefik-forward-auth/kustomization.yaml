apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app: traefik-forward-auth
  includeSelectors: true

resources:
- deployment.yaml
- service.yaml
- middleware.yaml
- ingressroute.yaml

configMapGenerator:
- name: traefik-forward-auth-rules
  files:
  - configs/rules.ini

# Copy secrets/traefik-forward-auth.env.example to
# secrets/traefik-forward-auth.env and fill it in. Keep the real file out of
# version control.
secretGenerator:
- name: traefik-forward-auth
  envs:
  - secrets/traefik-forward-auth.env
