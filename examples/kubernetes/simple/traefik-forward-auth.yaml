#
# traefik-forward-auth with minimal configuration, for a cluster that already
# runs Traefik v3 (for example from the official Helm chart).
#
# Apply in the same namespace as the IngressRoutes that use it.
#
apiVersion: v1
kind: Secret
metadata:
  name: traefik-forward-auth
  labels:
    app: traefik-forward-auth
type: Opaque
stringData:
  google-client-id: your-client-id
  google-client-secret: your-client-secret
  # Generate with `openssl rand -hex 32`
  secret: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-forward-auth
  labels:
    app: traefik-forward-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-forward-auth
  template:
    metadata:
      labels:
        app: traefik-forward-auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: traefik-forward-auth
        image: ghcr.io/priyankub/traefik-forward-auth-secure:latest
        ports:
        - name: http
          containerPort: 4181
        env:
        - name: WHITELIST
          value: "you@example.com"
        - name: LOG_LEVEL
          value: "info"
        - name: PROVIDERS_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: traefik-forward-auth
              key: google-client-id
        - name: PROVIDERS_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: traefik-forward-auth
              key: google-client-secret
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: traefik-forward-auth
              key: secret
        # The kubelet calls /ping directly, so it answers without a login.
        readinessProbe:
          httpGet:
            path: /ping
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-forward-auth
  labels:
    app: traefik-forward-auth
spec:
  type: ClusterIP
  selector:
    app: traefik-forward-auth
  ports:
  - name: http
    port: 4181
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-forward-auth
spec:
  forwardAuth:
    address: http://traefik-forward-auth:4181
    authResponseHeaders:
    - X-Forwarded-User
