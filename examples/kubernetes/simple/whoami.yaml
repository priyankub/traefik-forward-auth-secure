#
# Example app protected by the traefik-forward-auth middleware.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami
        ports:
        - name: http
          containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  labels:
    app: whoami
spec:
  selector:
    app: whoami
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`whoami.example.com`)
    kind: Rule
    middlewares:
    - name: traefik-forward-auth
    services:
    - name: whoami
      port: 80
  # Uses Traefik's default certificate; set certResolver to use ACME.
  tls: {}
