# Rules for traefik-forward-auth, loaded with CONFIG=/rules.ini.
# Rules use Traefik v2 rule syntax. Requests that match no rule need login.

# A public status page
rule.status.action = allow
rule.status.rule = Host(`status.example.com`)

# A public API path on an otherwise protected app
rule.public_api.action = allow
rule.public_api.rule = Host(`app.example.com`) && PathPrefix(`/api/public/`)

# Machines on the LAN, matched on the proxy-set X-Real-Ip. Never match
# X-Forwarded-For here: clients can set it, and the service refuses to start.
# rule.lan.action = allow
# rule.lan.rule = HeadersRegexp(`X-Real-Ip`, `^192\.168\.1\.[0-9]+$`)

# Only one person may reach the admin area
rule.admin.action = auth
rule.admin.rule = Host(`app.example.com`) && PathPrefix(`/admin/`)
rule.admin.whitelist = admin@example.com
